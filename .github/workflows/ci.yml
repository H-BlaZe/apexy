name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug

      - name: Check that no network permission slipped in
        run: |
          set -e
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          PERMS="$("$AAPT" dump permissions app/build/outputs/apk/debug/app-arm64-v8a-debug.apk)"
          echo "$PERMS"
          if echo "$PERMS" | grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)'; then
            echo "::error::The APK requests network access. Apexy must stay offline."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apexy-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
