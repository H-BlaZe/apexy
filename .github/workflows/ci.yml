name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --console=plain testFullDebugUnitTest testFossDebugUnitTest assembleDebug

      - name: Check that no network permission slipped in
        run: |
          set -e
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          for FLAVOR in full foss; do
            PERMS="$("$AAPT" dump permissions app/build/outputs/apk/$FLAVOR/debug/app-$FLAVOR-arm64-v8a-debug.apk)"
            echo "$PERMS"
            if echo "$PERMS" | grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)'; then
              echo "::error::The $FLAVOR APK requests network access. Apexy must stay offline."
              exit 1
            fi
          done

      - name: Check that the F-Droid build has no proprietary Google libraries
        run: |
          set -e
          if ./gradlew -q :app:dependencies --configuration fossReleaseRuntimeClasspath \
              | grep -E 'com\.google\.(mlkit|mediapipe|android\.gms|android\.datatransport|firebase)'; then
            echo "::error::The foss flavor pulls in a non-free Google library. F-Droid will reject it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apexy-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
